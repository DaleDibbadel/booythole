name: Build registry
on:
  push:
    branches: ['1.1']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: registry-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          set -euo pipefail
          (cd processing && npm ci)
          (cd site && npm ci)
      - name: Build and verify
        run: ./build.sh
      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
