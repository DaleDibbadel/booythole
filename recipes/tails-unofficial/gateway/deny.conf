# kbgw destination policy (EXAMPLE - the real file lives only on the Kasm agent host, not in this public repository).
# Names under these suffixes and these networks are refused on the SOCKS path even though they are public addresses (the owner's own admin hostnames / WAN address).
# Non-global addresses (RFC1918, loopback, link-local, ...) and single-label/internal names are always refused by kbgw.py regardless of this file.
suffix example.invalid
net 192.0.2.1/32
